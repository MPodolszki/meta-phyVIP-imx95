# Kconfig fragment for the ITE IT6263 LVDS-to-HDMI bridge on
# imx95-phyflex-libra-rdk-2 (phyVIP).
#
# CONFIG_DRM_ITE_IT6263 is the upstream driver (drivers/gpu/drm/bridge/
# ite-it6263.c, compatible "ite,it6263"), present since 6.13 and available
# in linux-phytec-imx 6.18.2.
#
# Note: the NXP fork CONFIG_DRM_ITE_IT6263_NXP (it6263.c) is enabled =y by
# imx_v8_defconfig, but binds on "ite,it6263-nxp" and therefore does not
# conflict with the overlay shipped alongside this fragment.
CONFIG_DRM_ITE_IT6263=m
CONFIG_DRM_BRIDGE=y
CONFIG_OF=y
CONFIG_I2C=y
