# CC33XX Wi-Fi driver (TI CC33xx)
CONFIG_CC33XX=m
CONFIG_CC33XX_SDIO=m
CONFIG_CC33XX_SPI=m

# Needed Wi-Fi dependencies
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_RFKILL=y

# Disable conflicting older TI Wi-Fi drivers
CONFIG_WL18XX=n
CONFIG_WLCORE_SDIO=n

# TI Bluetooth driver (CC33xx)
CONFIG_BT_TI=m
CONFIG_BT_TI_SDIO=m
CONFIG_BT_TI_UART=m
# BT_TI_UART selects BT_HCIUART_H4 automatically

# cc33xx-nvs.bin is optional (MAC address only) and is deliberately not
# shipped -- the phyVERSO drop does not contain it either. With the user-helper
# fallback enabled, every request_firmware() miss stalls for the full 60 s
# firmware timeout before the driver continues, measured on the board
# 2026-09-03: the cc33xx probe sat 60 s in "Falling back to sysfs fallback for:
# ti-connectivity/cc33xx-nvs.bin" on every boot. Nothing in this image loads
# firmware through the udev user helper, so turn the fallback off.
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
