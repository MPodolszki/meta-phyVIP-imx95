# CC33XX Wi-Fi driver (TI CC33xx)
CONFIG_CC33XX=m
CONFIG_CC33XX_SDIO=m
CONFIG_CC33XX_SPI=m

# Needed Wi-Fi dependencies
CONFIG_CFG80211=y
CONFIG_MAC80211=y
CONFIG_RFKILL=y

# Disable conflicting older TI Wi-Fi drivers
CONFIG_WL18XX=n
CONFIG_WLCORE_SDIO=n

# TI Bluetooth driver (CC33xx)
CONFIG_BT_TI=m
CONFIG_BT_TI_SDIO=m
CONFIG_BT_TI_UART=m
# BT_TI_UART selects BT_HCIUART_H4 automatically
